services:
  - type: web
    name: novarent-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /salud
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: novarent-db
          property: connectionString
      - key: ENTORNO
        value: produccion
      - key: CARGAR_DATOS_DEMO
        value: "true"
databases:
  - name: novarent-db
    plan: free